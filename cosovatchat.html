(()=>{'use strict';const key='ktx_step169_cosovatchat';const cols=["KTX", "Dãy", "Phòng/Khu vực", "Giường", "Điều hòa", "Tủ", "Quạt", "Ổ cắm điện", "Remote", "Bóng tuýp", "Bàn ăn", "Ghế ăn", "Ghi chú"];const nums=new Set([3, 4, 5, 6, 7, 8, 9, 10, 11]);let data=[],editing=-1;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const v=JSON.parse(localStorage.getItem(key)||'[]');window.__facLocalBackup=Array.isArray(v)?v:[];data=[]}catch{}let cloudClient=null,cloudRev=null,cloudReady=false,cloudBusy=false,cloudAdmin=false,cloudUserId=null,cloudRowExists=false;

const cloudHint=()=>document.getElementById('fac69StorageNote');

function cloudLock(locked){cloudBusy=locked;['save','add','addTop','importTop'].forEach(id=>{const el=$(id);if(el)el.disabled=locked||!cloudAdmin||!cloudReady});}
async function remoteSnapshot(){const {data:row,error}=await cloudClient.from('ktx_utility_snapshots').select('module_key,revision,updated_at,rows').eq('module_key',cloudKey).maybeSingle();if(error)throw error;return row}

let lastCommitted=[];
async function persist(){

 try{
  const payload={rows:latest,updated_by:cloudUserId,updated_at:new Date().toISOString()};let res;
  if(cloudRowExists){
   res=await cloudClient.from('ktx_utility_snapshots').update({...payload,revision:cloudRev+1}).eq('module_key',cloudKey).eq('revision',cloudRev).select('revision').maybeSingle();
   if(!res.error&&!res.data)throw Error('Dữ liệu Cloud đã thay đổi trên thiết bị khác. Cần tải lại trước khi sửa tiếp.');
  }else{
   res=await cloudClient.from('ktx_utility_snapshots').insert({module_key:cloudKey,revision:1,...payload}).select('revision').single();
  }

  cloudRev=res.data.revision;cloudRowExists=true;lastCommitted=deepRows(latest);
  if((window.__facLocalBackup||[]).length&&!localStorage.getItem(key+'_pre_cloud_migration'))localStorage.setItem(key+'_pre_cloud_migration',JSON.stringify(window.__facLocalBackup));
  localStorage.setItem(key,JSON.stringify(latest));
  cloudStatus('Đã lưu Supabase ('+latest.length+' phòng/khu vực) · Phiên bản '+cloudRev+'.');return true;
 }catch(e){data=deepRows(lastCommitted);render();cloudStatus('Lưu thất bại, đã hoàn tác thay đổi trên màn hình: '+(e.message||e),true);return false}

}
async function initializeCloud(){

 const hint=cloudHint();if(hint){hint.innerHTML='<b data-cloud-state>Đang kết nối Supabase…</b> <button type="button" id="facImportExisting" style="margin-left:12px;padding:6px 10px;border-radius:7px;border:1px solid #a6b9de;background:#fff">Chuyển dữ liệu cũ lên Cloud (Admin)</button> <button type="button" id="facCloudRefresh" style="margin-left:6px;padding:6px 10px;border-radius:7px;border:1px solid #a6b9de;background:#fff">Tải lại Cloud</button>'}

  if(!cloudReady||!cloudAdmin)return cloudStatus('Chỉ Admin đã kết nối Cloud mới được chuyển dữ liệu.',true);

let activeKtx='1';function getKtx(r){const x=String(r['KTX']??'').trim();const m=x.match(/(?:ktx\s*)?(\d+)/i);return m?m[1]:x}function getRows(){const q=$('search').value.toLocaleLowerCase('vi');const day=$('dayFilter').value;return data.map((r,i)=>({...r,_i:i})).filter(r=>(activeKtx==='all'||getKtx(r)===activeKtx)&&(!day||String(r['Dãy']??'')===day)&&(!q||cols.some(k=>String(r[k]??'').toLocaleLowerCase('vi').includes(q))))}function refreshDays(){const old=$('dayFilter').value;const vals=[...new Set(data.filter(r=>activeKtx==='all'||getKtx(r)===activeKtx).map(r=>String(r['Dãy']??'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true}));$('dayFilter').innerHTML='<option value="">Tất cả Dãy</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vals.includes(old))$('dayFilter').value=old}function render(){refreshDays();const rows=getRows();const items=[['Giường','▣'],['Điều hòa','↔'],['Tủ','⬡'],['Quạt','✿'],['Ổ cắm điện','ϟ'],['Remote','▤'],['Bóng tuýp','◉'],['Bàn ăn','▥'],['Ghế ăn','▧']];$('facStats').innerHTML=items.map(([k,ic])=>'<div class="fac-stat"><span class="ic">'+ic+'</span><small>'+esc(k)+'</small><b>'+rows.reduce((a,r)=>a+(Number(r[k])||0),0).toLocaleString('vi-VN')+'</b></div>').join('');$('facTableTitle').innerHTML=''+(activeKtx==='all'?'Toàn KTX':'KTX '+activeKtx)+' — '+rows.length+' phòng/khu vực <small>· Hiển thị theo bộ lọc hiện tại</small>';$('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Thao tác</th></tr>';$('tbody').innerHTML=rows.map(r=>'<tr>'+cols.map((c,i)=>'<td>'+(i===0?'<span class="fac-pill">'+esc(r[c]??'')+'</span>':esc(r[c]??''))+'</td>').join('')+'<td><div class="fac-rowactions"><button data-edit="'+r._i+'" title="Sửa">✎ Sửa</button><button class="danger" data-del="'+r._i+'" title="Xóa">♲ Xóa</button></div></td></tr>').join('')||'<tr><td colspan="'+(cols.length+1)+'" class="fac-empty">Chưa có phòng hoặc khu vực phù hợp bộ lọc.</td></tr>';const mobileList=$('
