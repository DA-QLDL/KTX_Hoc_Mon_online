(()=>{'use strict';const key='ktx_step169_cosovatchat';const cols=["KTX", "Dãy", "Phòng/Khu vực", "Chỗ", "Điều hòa", "Tủ", "Quạt", "Ổ cắm điện", "Remote", "Bóng tuýp", "Bàn ăn", "Ghế ăn", "Ghi chú"];const displayLabel=c=>c==='Chỗ'?'Giường':c;const nums=new Set([3, 4, 5, 6, 7, 8, 9, 10, 11]);let data=[],editing=-1,inlineEditing=-1;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));window.__facLocalBackup=[];data=[];let cloudClient=null,cloudRev=null,cloudReady=false,cloudBusy=false,cloudAdmin=false,cloudScopeKtx=[],cloudScopeDays=[],cloudUserId=null,cloudRowExists=false;

   if(!res.error&&!res.data)throw Error('Dữ liệu Cloud đã thay đổi trên thiết bị khác. Cần tải lại trước khi sửa tiếp.');
  }else{
   res=await cloudClient.from('ktx_utility_snapshots').insert({module_key:cloudKey,revision:1,...payload}).select('revision').single();
  }
  if(res.error)throw res.error;
  cloudRev=res.data.revision;cloudRowExists=true;lastCommitted=deepRows(latest);
  cloudStatus('Đã lưu Supabase ('+latest.length+' phòng/khu vực) · Phiên bản '+cloudRev+'.');return true;
 }catch(e){data=deepRows(lastCommitted);render();cloudStatus('Lưu thất bại, đã hoàn tác thay đổi trên màn hình: '+(e.message||e),true);return false}

}
async function initializeCloud(){

 const hint=cloudHint();if(hint){hint.innerHTML='<b data-cloud-state>Đang kết nối Supabase…</b> <button type="button" id="facCloudRefresh" style="margin-left:6px;padding:6px 10px;border-radius:7px;border:1px solid #a6b9de;background:#fff">Tải lại Cloud</button>'}

  if(cloudBusy)return;

  await loadCloudRows();
 };
 try{
  const p=window.parent;

  const snap=await remoteSnapshot();
  if((snap?.revision??null)!==cloudRev){
   await loadCloudRows();

let activeKtx='all';function getKtx(r){const x=String(r['KTX']??'').trim();const m=x.match(/(?:ktx\s*)?(\d+)/i);return m?m[1]:x}const facilityCollator=new Intl.Collator('vi',{numeric:true,sensitivity:'base'});
function compareFacilityRooms(a,b){
  const ak=String(a['KTX']??''),bk=String(b['KTX']??'');
  const k=facilityCollator.compare(ak,bk);if(k)return k;
  const d=facilityCollator.compare(String(a['Dãy']??''),String(b['Dãy']??''));if(d)return d;
  const ar=String(a['Phòng/Khu vực']??'').trim(),br=String(b['Phòng/Khu vực']??'').trim();
  // Khu vực có tên riêng đi trước, các phòng đánh số xếp theo giá trị số.
  const an=/^(?:phòng|phong|p\.?)[\s.:-]*(\d+)(?!\d)/i.exec(ar);
  const bn=/^(?:phòng|phong|p\.?)[\s.:-]*(\d+)(?!\d)/i.exec(br);
  if(Boolean(an)!==Boolean(bn))return an?1:-1;
  if(an&&bn){const byNumber=Number(an[1])-Number(bn[1]);if(byNumber)return byNumber;}

function refreshKtxTabs(){

  .sort((a,b)=>facilityCollator.compare(a,b));

 const desired=['all',...values];
