<!doctype html>
<html lang="vi">

  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #f4f7fb; color: #1d2c44; padding: 24px; }
    main { width: min(100%, 450px); padding: clamp(26px, 6vw, 42px); text-align: center; background: white; border: 1px solid #dce5f1; border-radius: 18px; box-shadow: 0 16px 40px rgba(23,59,112,.08); }
    .code { margin: 0; font-size: clamp(62px, 12vw, 86px); font-weight: 800; line-height: 1; letter-spacing: -.05em; color: #173B70; }
    h1 { margin: 16px 0 10px; font-size: clamp(21px, 5vw, 26px); }
    p { margin: 0 0 25px; font-size: 15px; line-height: 1.6; color: #52637b; }
    a { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: 11px 20px; border-radius: 10px; background: #173B70; color: white; text-decoration: none; font-weight: 650; }
    a:hover { background: #254e86; }
    a:focus-visible { outline: 3px solid #18765D; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Không tìm thấy trang</h1>
