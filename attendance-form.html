<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điểm danh KTX Hóc Môn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./qr-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#15294b;font:14px/1.5 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}.card{background:white;width:min(530px,100%);border-radius:19px;padding:25px;border:1px solid #d6e4f6;box-shadow:0 12px 38px #1737661a}h1{margin:5px 0;font-size:23px}.mut{color:#59728d}label{display:block;margin-top:14px;font-weight:650;font-size:12px}input,select{display:block;width:100%;margin-top:5px;padding:13px;border:1px solid #d0dff1;border-radius:10px;font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:800;background:#2468e9;color:white;width:100%;margin-top:18px}button:disabled{opacity:.55}.tip{padding:12px;background:#edf5ff;border-radius:11px;margin-top:18px}.msg{margin-top:12px;font-weight:650;white-space:pre-wrap}.bad{color:#be2440}.good{color:#07824f}.brand{font-weight:900;color:#2265d9}</style><style id="ktx-step245-design">
/* STEP245 - shared design system. Presentation only, no business logic. */
:root{--ktx-brand:#2765ea;--ktx-purple:#6755ef;--ktx-brand-soft:#edf3ff;--ktx-success:#0c9a65;--ktx-danger:#d83a4d;--ktx-warning:#c97917;--ktx-ui-radius:11px;--ktx-ui-shadow:0 3px 12px rgba(30,70,145,.09)}
button,a,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
button:not(:disabled){transition:background-color .16s,border-color .16s,box-shadow .16s,transform .13s,filter .13s}
button:not(:disabled):active{transform:scale(.985)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ktx-brand);outline-offset:2px}
input,textarea,select{min-width:0;box-sizing:border-box}
.ktx-header-brand{display:inline-flex;align-items:center;gap:9px;min-width:0}
.ktx-header-brand img{height:42px;width:42px;aspect-ratio:1;object-fit:cover;border-radius:12px;flex-shrink:0;box-shadow:0 3px 12px rgba(54,76,219,.15)}
.ktx-page-logo{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 4px 12px rgba(40,65,190,.16)}
.ktx-heading-row{display:flex;align-items:center;gap:11px;min-width:0}
.ktx-heading-row h1{min-width:0;overflow-wrap:anywhere}
@media(max-width:640px){.ktx-header-brand img,.ktx-page-logo{width:36px;height:36px;border-radius:10px}.ktx-heading-row{gap:9px}}

.brand{display:flex;align-items:center;gap:10px;color:#174bad}
button#send{background:linear-gradient(125deg,#2765ea,#6755ef)!important;border-radius:12px;color:white!important}
@media(max-width:600px){main.card{max-width:100%;margin:12px!important;padding:18px 15px!important}input,select{font-size:16px!important}button#send{min-height:48px}}
</style>
<link rel="icon" type="image/png" href="./pwa-icon-192.png"/>
<meta name="theme-color" content="#2765ea"/>
</head><body><main class="card"><div class="brand"><img class="ktx-page-logo" src="./ktx-logo.png" alt="Logo KTX Hóc Môn"><span>KÝ TÚC XÁ HÓC MÔN</span></div><h1>Điểm danh công nhân</h1><form id="attForm"><label>Mã nhân viên *<input name="worker_code" required maxlength="60" autocomplete="off"></label><label>Họ và tên *<input name="worker_name" required maxlength="120"></label><label>KTX *<select name="ktx" required><option value="">Chọn KTX</option><option>KTX 1</option><option>KTX 2</option></select></label><label>Dãy *<select name="day" required><option value="">Chọn dãy</option><option>Dãy 1</option><option>Dãy 2</option><option>Dãy 3</option><option>Dãy 4</option><option>Dãy 5</option><option>Dãy 6</option></select></label><label>Phòng *<select name="room" required><option value="">Chọn phòng</option><option value="1">Phòng 1</option><option value="2">Phòng 2</option><option value="3">Phòng 3</option><option value="4">Phòng 4</option><option value="5">Phòng 5</option><option value="6">Phòng 6</option><option value="7">Phòng 7</option><option value="8">Phòng 8</option><option value="9">Phòng 9</option><option value="10">Phòng 10</option><option value="11">Phòng 11</option><option value="12">Phòng 12</option><option value="13">Phòng 13</option><option value="14">Phòng 14</option><option value="15">Phòng 15</option></select></label><label>Loại điểm danh *<select name="direction" required><option value="in">Điểm danh Vào</option><option value="out">Điểm danh Ra</option></select></label><button type="submit" id="send">Gửi điểm danh</button></form><div id="result" class="msg" role="status"></div></main><script>
const sid=new URLSearchParams(location.search).get('session');
async function ensureSession(){if(!sid)return true; if(!/^[0-9a-f-]{36}$/i.test(sid))throw Error('Mã phiên không hợp lệ.');const {data,error}=await sb.from('ktx_attendance_sessions').select('id,session_day,ktx,status').eq('id',sid).maybeSingle();if(error||!data)throw Error('Không tìm thấy phiên điểm danh.');if(data.status!=='open')throw Error('Phiên điểm danh đã đóng.');const now=new Date().toLocaleDateString('en-CA');if(data.session_day!==now)throw Error('Mã QR không có hiệu lực hôm nay.');if(data.ktx){const choice=form.querySelector('[name="ktx"]');choice.value=data.ktx;choice.disabled=true;}return data;}
const form=document.getElementById('attForm'),msg=document.getElementById('result'),btn=document.getElementById('send');let sb;try{const c=window.KTX_QR_CONFIG||{};if(!/^https:\/\//.test(c.url)||!c.key)throw Error('Chưa cấu hình kết nối QR.');sb=supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){msg.textContent=e.message;msg.className='msg bad';btn.disabled=true}
form.addEventListener('submit',async e=>{e.preventDefault();if(!sb)return;const fd=new FormData(form);const payload={worker_code:String(fd.get('worker_code')||'').trim(),worker_name:String(fd.get('worker_name')||'').trim(),ktx:String(fd.get('ktx')||''),direction:String(fd.get('direction')||'in'),day:String(fd.get('day')||''),room:String(fd.get('room')||'')};if(!payload.worker_code||!payload.worker_name||!payload.ktx||!payload.day||!payload.room)return;btn.disabled=true;msg.textContent='Đang gửi...';msg.className='msg';try{const session=await ensureSession();if(sid){payload.session_id=sid;if(session.ktx&&payload.ktx!==session.ktx)throw Error('Sai KTX của phiên.')}const {error}=await sb.from('ktx_attendance_qr_requests').insert(payload);if(error)throw error;msg.textContent='Đã gửi yêu cầu điểm danh. Vui lòng chờ Ban quản lý xác nhận.';msg.className='msg good';form.reset()}catch(err){msg.textContent='Không gửi được: '+(err.message||err)+'. Kiểm tra thiết lập bảng điểm danh QR trên Supabase.';msg.className='msg bad'}finally{btn.disabled=false}});
</script></body></html>
