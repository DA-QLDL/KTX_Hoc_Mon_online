<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đăng ký KTX Hóc Môn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./qr-config.js"></script><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14213a;background:#eef3fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center}.box{width:min(590px,100%);background:#fff;border:1px solid #dbe4f0;border-radius:22px;padding:22px;box-shadow:0 16px 50px #1b2f5a1c}.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#2f6fe8,#6d4bf0);color:#fff;font-weight:800}h1{font-size:23px;margin:10px 0 0}.sub{font-size:13px;color:#657693;margin:4px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d7e0ee;border-radius:12px;font:inherit;font-size:15px;outline:none;background:#fff}textarea{resize:vertical;min-height:72px}input:focus,select:focus,textarea:focus{border-color:#2f6fe8}button{width:100%;border:0;border-radius:13px;padding:13px 16px;margin-top:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#159963,#22c98f);cursor:pointer}button.out{background:linear-gradient(135deg,#d99019,#f0ab2b)}button:disabled{opacity:.5}.msg{margin-top:13px;padding:11px 12px;border-radius:11px;font-size:13px;display:none}.ok{display:block;background:#e5f8ef;color:#087a4a}.er{display:block;background:#fde8ea;color:#bb2338}.wn{display:block;background:#fff3d8;color:#9b5b00}.note{font-size:11px;color:#7a899f;line-height:1.45;margin-top:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="box"><div class="logo">KTX</div><h1 id="title"></h1><div class="sub" id="subtitle"></div><div class="grid" id="form"></div><button id="send">Gửi đăng ký</button><div id="msg" class="msg"></div><div class="note">Thông tin được gửi trực tiếp về mục duyệt của Ban quản lý KTX. Vui lòng nhập chính xác thông tin.</div></div><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),mode=q.get('mode')==='out'?'out':'in',F=$('form');function msg(t,k='ok'){$('msg').className='msg '+k;$('msg').textContent=t}const C=window.KTX_QR_CONFIG||{};let sb=null;try{if(!/^https:\/\//.test(C.url)||!C.key||/PASTE_|YOUR_/i.test(C.key))throw new Error('Biểu mẫu chưa được cấu hình Supabase.');sb=supabase.createClient(C.url,C.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){msg(e.message,'er');$('send').disabled=true}
if(mode==='in'){$('title').textContent='Đăng ký vào KTX Hóc Môn';$('subtitle').textContent='Điền thông tin bên dưới. Hồ sơ chỉ được thêm vào danh sách KTX sau khi Ban quản lý duyệt.';F.innerHTML=`<label class="wide">Họ và tên *<input id="name" autocomplete="name"></label><label>Mã nhân viên<input id="code" autocomplete="off"></label><label>Số CCCD *<input id="cccd" inputmode="numeric"></label><label>Số điện thoại *<input id="phone" inputmode="tel"></label><label>Ngày sinh<input id="dob" type="date"></label><label>Giới tính<select id="gender"><option value="">— Chọn —</option><option>Nam</option><option>Nữ</option></select></label><label>KTX *<select id="ktx"><option value="">— Chọn KTX —</option><option>KTX 1</option><option>KTX 2</option></select></label><label>Dãy *<input id="day" placeholder="Dãy 1"></label><label>Phòng *<input id="room" placeholder="101"></label><label>Đơn vị / Nhà thầu<input id="unit"></label><label>Tiểu đoàn<input id="td"></label><label>Tổ trưởng<input id="leader"></label><label class="wide">Địa chỉ / Quê quán<textarea id="address"></textarea></label>`}else{$('title').textContent='Đăng ký ra khỏi KTX';$('subtitle').textContent='Chỉ cần nhập 4 thông tin. Sau khi Ban quản lý duyệt, dữ liệu sẽ được chuyển khỏi danh sách tổng.';$('send').classList.add('out');F.innerHTML=`<label class="wide">Họ và tên *<input id="name" autocomplete="name"></label><label class="wide">Mã nhân viên *<input id="code" autocomplete="off"></label><label>Dãy *<input id="day" placeholder="Dãy 1"></label><label>Phòng *<input id="room" placeholder="101"></label>`}
const val=id=>$(id)?$(id).value.trim():'';$('send').onclick=async()=>{const name=val('name'),code=val('code'),day=val('day'),room=val('room');if(!name)return msg('Vui lòng nhập họ và tên.','wn');if(mode==='out'&&!code)return msg('Vui lòng nhập mã nhân viên.','wn');if(!day)return msg('Vui lòng nhập dãy.','wn');if(!room)return msg('Vui lòng nhập phòng.','wn');if(mode==='in'&&!val('cccd'))return msg('Vui lòng nhập số CCCD.','wn');if(mode==='in'&&!val('phone'))return msg('Vui lòng nhập số điện thoại.','wn');if(mode==='in'&&!val('ktx'))return msg('Vui lòng chọn KTX.','wn');$('send').disabled=true;$('send').textContent='Đang gửi...';const payload={request_type:mode,worker_code:code||null,name,day,room,cccd:mode==='in'?val('cccd').replace(/\D/g,''):null,phone:mode==='in'?val('phone').replace(/\D/g,''):null,dob:mode==='in'?val('dob')||null:null,gender:mode==='in'?val('gender')||null:null,unit:mode==='in'?val('unit')||null:null,td:mode==='in'?val('td')||null:null,leader:mode==='in'?val('leader')||null:null,address:mode==='in'?val('address')||null:null,ktx:mode==='in'?val('ktx')||null:null};try{const {error}=await sb.from('residency_requests').insert(payload);if(error)throw error;msg(mode==='in'?'Đã gửi đăng ký vào KTX. Vui lòng chờ Ban quản lý duyệt.':'Đã gửi đăng ký ra khỏi KTX. Vui lòng chờ Ban quản lý duyệt.','ok');$('send').textContent='Đã gửi thành công'}catch(e){msg('Không gửi được: '+(e.message||e),'er');$('send').disabled=false;$('send').textContent='Gửi đăng ký'}};
</script></body></html>
