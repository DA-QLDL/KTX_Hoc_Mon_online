 *<input id="name" autocomplete="name"></label><label>Mã nhân viên<input id="code" autocomplete="off"></label><label>Số điện thoại<input id="phone" inputmode="tel"></label><label class="wide">Số CCCD *<input id="cccd" inputmode="numeric"></label><label>Dãy *<select id="day"><option value="">— Chọn dãy —</option>${Array.from({length:6},(_,i)=>`<option value="Dãy ${i+1}">Dãy ${i+1}</option>`).join('')}</select></label><label>Phòng *<select id="room"><option value="">— Chọn phòng —</option>${Array.from({length:15},(_,i)=>`<option value="${i+1}">Phòng ${i+1}</option>`).join('')}</select></label><label class="wide">Lý do ra khỏi KTX *<select id="reason"><option value="">— Chọn lý do —</option><option>Điều chuyển</option><option>Nghỉ việc</option><option>Dọn ra ngoài ở</option><option>Khác</option></select></label>`}

const val=id=>$(id)?$(id).value.trim():'';const dobIso=v=>{v=String(v||'').trim();let m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m){const d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3],dt=new Date(`${y}-${mo}-${d}T00:00:00`);return dt.getFullYear()==+y&&dt.getMonth()+1==+mo&&dt.getDate()==+d?`${y}-${mo}-${d}`:''}if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,mo,d]=v.split('-').map(Number),dt=new Date(`${v}T00:00:00`);return dt.getFullYear()==y&&dt.getMonth()+1==mo&&dt.getDate()==d?v:''}return ''};$('send').onclick=async()=>{const name=val('name'),code=val('code'),day=val('day'),room=val('room');if(!name)return msg('Vui lòng nhập họ và tên.','wn');if(mode==='out'&&!val('cccd'))return msg('Vui lòng nhập số CCCD.','wn');if(!day)return msg('Vui lòng nhập dãy.','wn');if(!room)return msg('Vui lòng nhập phòng.','wn');if(mode==='out'&&!val('reason'))return msg('Vui lòng chọn lý do ra khỏi KTX.','wn');if(mode==='in'&&!val('cccd'))return msg('Vui lòng nhập số CCCD.','wn');if(mode==='in'&&!val('phone'))return msg('Vui lòng nhập số điện thoại.','wn');if(mode==='in'&&!val('dob'))return msg('Vui lòng nhập ngày sinh.','wn');const dob=mode==='in'?dobIso(val('dob')):null;if(mode==='in'&&!dob)return msg('Ngày sinh không hợp lệ. Vui lòng nhập theo dạng DD/MM/YYYY, ví dụ 04/10/1986.','wn');if(mode==='in'&&!val('gender'))return msg('Vui lòng chọn giới tính.','wn');if(mode==='in'&&!val('ktx'))return msg('Vui lòng chọn KTX.','wn');$('send').disabled=true;$('send').textContent='Đang gửi...';const payload={request_type:mode,worker_code:code||null,name,day,room,cccd:val('cccd')?val('cccd').replace(/\D/g,''):null,phone:val('phone')?val('phone').replace(/\D/g,''):null,dob,gender:mode==='in'?val('gender'):null,unit:mode==='in'?val('unit')||null:null,td:mode==='in'?val('td')||null:null,leader:mode==='in'?val('leader')||null:null,leader_phone:mode==='in'?val('leader_phone').replace(/\D/g,'')||null:null,address:mode==='in'?val('address')||null:null,ktx:mode==='in'?val('ktx')||nul /* STEP248 – classify action buttons by meaning, including dynamically rendered dialogs. */
(function(){
 const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
 function tone(el){
   if(el.dataset.actionTone) return el.dataset.actionTone;
   const label=norm((el.innerText||el.textContent||'').replace(/[\s\u00a0]+/g,' '));
   const cls=' '+String(el.className||'')+' ';
   if(/(^|\s)(danger|sf-danger|r)(\s|$)/.test(cls)||/\b(xoa|xoa han|huy bo|tu choi|khoi phuc mac dinh|dat lai|delete|remove)\b/.test(label))return 'danger';
   if(/\b(hoan tac|canh bao|khoa)\b/.test(label))return 'warning';
   if(/(^|\s)(primary|sf-green|g)(\s|$)/.test(cls)||/^(xac nhan|luu|duyet|tao |them |dang nhap|gui |hoan thanh|cap nhat|ap dung|chuyen phong)/.test(label))return 'success';
   if(/\b(xuat|tai |import|chon file|chon nhieu|scan|quet|trich xuat|xem va xuat)\b/.test(label))return 'primary';
   if(/\b(chinh sua|sua |nhap |chon|tiep theo|phuong an)\b/.test(label))return 'accent';
   if(/\b(quay lai|dong|huy$|tro ve|back)\b/.test(label))return 'secondary';
   return 'neutral';
 }
 function eligible(el){
   if(!(el instanceof HTMLElement)) return false;
   if(el.closest('nav,aside,.sidebar,.tabs,.tabbar,.bottom-nav,.mobile-nav,.m-nav,.system-hub-nav,.sysfunc-grid,.sysfunc-btn')) return false;
   if(el.matches('[data-ui-no-tone],.sysfunc-btn,.tab,.alert-float,[role=tab]')) return false;
   if(el.classList.contains('ib') && !el.getAttribute('aria-label') && !el.getAttribute('title'))return false;
   return true;
 }
 function apply(el){
   if(!eligible(el))return;
   // Keep styled dashboard tiles and external component buttons intact.
   if(el.classList.contains('ktx-action'))return;
   const t=tone(el);el.classList.add('ktx-action');el.dataset.actionTone=t;
   if((el.textContent||'').length>45)el.classList.add('ktx-long');
